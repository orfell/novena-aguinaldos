<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Villancicos</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header class="topbar">
    <a class="brand" href="./index.html" aria-label="Volver al inicio">🎄 Novena de Aguinaldos</a>
    <div class="top-actions">
      <a class="btn small" href="./index.html">Inicio</a>
      <button id="btnToggleTheme" class="btn small" type="button" aria-label="Cambiar tema claro/oscuro">🌙</button>
    </div>
  </header>

  <main class="container">

    <section class="card">
      <h1 class="h1">Villancicos</h1>
      <div class="muted">Toca un villancico para reproducirlo aquí mismo.</div>
    </section>

    <!-- Reproductor embebido (UNO SOLO) -->
    <section class="card">
      <h2 class="h2" id="playerTitle">Selecciona un villancico</h2>

      <div style="position:relative; width:100%; padding-top:56.25%; border-radius: var(--radius); overflow:hidden; border:1px solid var(--border);">
        <iframe
          id="ytPlayer"
          title="Reproductor de YouTube"
          style="position:absolute; inset:0; width:100%; height:100%; border:0;"
          src=""
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>

      <div id="playerHint" class="muted" style="margin-top:10px;">
        El video se abrirá aquí cuando elijas uno del listado.
      </div>
    </section>

    <!-- Buscar -->
    <section class="card">
      <h2 class="h2">Buscar</h2>
      <input id="searchInput" type="search" placeholder="Escribe el nombre del villancico…"
             class="btn" style="width:100%; text-align:left;"
             aria-label="Buscar villancico por nombre" />
      <div id="countInfo" class="muted" style="margin-top:10px;"></div>
    </section>

    <!-- Lista (scroll natural) -->
    <section class="card">
      <h2 class="h2">Listado</h2>
      <div id="list"
			style="display:grid; gap:10px; overflow:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--border); border-radius: var(--radius); padding:10px;"
			aria-label="Listado de villancicos (desliza para ver más)">
	</div>

    </section>

  </main>

  <footer class="footer">
    <div class="muted">Julio Ricardo Martínez Montezuma</div>
	<div class="muted">2025</div>
  </footer>

  <script>
    // Tema persistente igual que index/day
    (function () {
      const btnTheme = document.getElementById("btnToggleTheme");
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") document.documentElement.classList.add("dark");

      btnTheme?.addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
        localStorage.setItem(
          "theme",
          document.documentElement.classList.contains("dark") ? "dark" : "light"
        );
      });
    })();

    async function loadVillancicos() {
      const res = await fetch("data/villancicos.json", { cache: "no-store" });
      if (!res.ok) throw new Error("No se pudo cargar data/villancicos.json");
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("villancicos.json debe ser un arreglo");
      return data;
    }

    function normalize(s){
      return (s || "")
        .toString()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function getYouTubeId(url){
      if (!url) return "";
      const u = url.toString().trim();
      // youtu.be/ID
      const m1 = u.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/);
      if (m1) return m1[1];
      // youtube.com/watch?v=ID
      const m2 = u.match(/[?&]v=([A-Za-z0-9_-]{6,})/);
      if (m2) return m2[1];
      // youtube.com/embed/ID
      const m3 = u.match(/youtube\.com\/embed\/([A-Za-z0-9_-]{6,})/);
      if (m3) return m3[1];
      return "";
    }

    function setPlayer(nombre, url){
      const id = getYouTubeId(url);
      const titleEl = document.getElementById("playerTitle");
      const hintEl  = document.getElementById("playerHint");
      const iframe  = document.getElementById("ytPlayer");

      titleEl.textContent = nombre || "Villancico";
      if (!id) {
        iframe.src = "";
        hintEl.textContent = "Este villancico no tiene URL válida de YouTube.";
        return;
      }

      // autoplay=1 para que arranque al tocar (si el navegador lo permite)
      iframe.src = `https://www.youtube.com/embed/${id}?rel=0&modestbranding=1&autoplay=1`;
      hintEl.textContent = "Si no reproduce automáticamente, pulsa ▶ dentro del video.";
    }

    function makeRow(v, idx){
      const nombre = (v.Nombre || v.nombre || v.Titulo || v.titulo || `Villancico ${idx+1}`).toString().trim();
      const url = (v.Url || v.url || v.Video || v.videolink || "").toString().trim();
      const ok = Boolean(getYouTubeId(url));

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn";
      btn.style.textAlign = "left";
      btn.style.width = "100%";
      btn.style.display = "flex";
      btn.style.justifyContent = "space-between";
      btn.style.alignItems = "center";
      btn.style.gap = "10px";

      const left = document.createElement("div");
      left.style.display = "grid";
      left.style.gap = "2px";

      const t = document.createElement("div");
      t.style.fontWeight = "800";
      t.textContent = nombre;

      const s = document.createElement("div");
      s.className = "muted";
      s.textContent = ok ? "YouTube" : "Sin enlace válido";

      left.appendChild(t);
      left.appendChild(s);

      const right = document.createElement("div");
      right.textContent = ok ? "▶" : "—";
      right.setAttribute("aria-hidden", "true");

      btn.appendChild(left);
      btn.appendChild(right);

      if (!ok){
        btn.disabled = true;
        btn.style.opacity = "0.6";
        return btn;
      }

      btn.addEventListener("click", () => {
        setPlayer(nombre, url);
        // En móvil: subir suavemente al reproductor
        document.getElementById("playerTitle").scrollIntoView({ behavior: "smooth", block: "start" });
      });

      return btn;
    }

    (async function main(){
      const listEl = document.getElementById("list");
      const search = document.getElementById("searchInput");
      const countInfo = document.getElementById("countInfo");

      let all = [];
      try{
        all = await loadVillancicos();
      }catch(e){
        listEl.innerHTML = `<div class="muted">Error: ${String(e)}</div>`;
        return;
      }

      function render(items){
        listEl.innerHTML = "";
        items.forEach((v, i) => listEl.appendChild(makeRow(v, i)));
      }

      function applyFilter(){
        const q = normalize(search.value);
        const filtered = !q ? all : all.filter(v => normalize(v.Nombre || v.nombre || v.Titulo || v.titulo).includes(q));
        countInfo.textContent = `Mostrando ${filtered.length} de ${all.length}`;
        render(filtered);
      }

      search.addEventListener("input", applyFilter);
      applyFilter();

      // Si el primer item tiene video, lo preseleccionamos (opcional)
      const firstWithUrl = all.find(v => getYouTubeId(v.Url || v.url || v.Video || v.videolink));
      if (firstWithUrl) setPlayer(firstWithUrl.Nombre || firstWithUrl.Titulo || "Villancico", firstWithUrl.Url || firstWithUrl.url || "");
    })();
  </script>
</body>
</html>
