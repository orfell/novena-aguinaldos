<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Villancicos · Novena de Aguinaldos</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/img/favicon.png">

  <!-- Open Graph -->
  <meta property="og:title" content="Novena de Aguinaldos">
  <meta property="og:description" content="Familia Martínez Cuenca">
  <meta property="og:image" content="https://orfell.github.io/novena-aguinaldos/assets/img/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://orfell.github.io/novena-aguinaldos/">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="dark no-contrast">

  <!-- =========================
       TOPBAR (MISMA QUE DÍAS)
       ========================= -->
  <header class="topbar topbar--double" role="banner">

    <!-- Fila 1: título -->
    <div class="topbar-row topbar-row--brand">
      <span class="brand-title">🎄 Novena de Aguinaldos</span>
    </div>

    <!-- Fila 2: acciones -->
    <nav class="topbar-row topbar-row--actions" aria-label="Acciones">
      <!-- IDs usados por accessibility.js -->
      <button id="btnTextSmaller" class="btn small" type="button" aria-label="Disminuir texto">A-</button>
      <button id="btnTextBigger" class="btn small" type="button" aria-label="Aumentar texto">A+</button>
      <a href="./index.html" class="btn small btn-home" aria-label="Inicio">Inicio</a>
    </nav>

  </header>

  <!-- =========================
       CONTENIDO
       ========================= -->
  <main class="container" role="main">

    <!-- Título -->
    <section class="card">
      <h1 class="page-title">Villancicos</h1>
      <p class="muted">
        Toca un villancico para reproducirlo aquí mismo.
      </p>
    </section>

    <!-- Reproductor -->
    <section class="card">
      <h2 class="h2" id="playerTitle">Selecciona un villancico</h2>

      <div
        style="
          position:relative;
          width:100%;
          padding-top:56.25%;
          border-radius:16px;
          overflow:hidden;
          border:1px solid rgba(255,255,255,0.18);
          box-shadow:0 10px 24px rgba(0,0,0,0.25);
        ">
        <iframe
          id="ytPlayer"
          title="Reproductor de YouTube"
          style="position:absolute; inset:0; width:100%; height:100%; border:0;"
          src=""
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>

      <p class="muted" id="playerHint" style="margin-top:10px;">
        Si no reproduce automáticamente, pulsa ▶ dentro del video.
      </p>
    </section>

    <!-- Buscar -->
    <section class="card">
      <h2 class="h2">Buscar</h2>
      <input
        id="searchInput"
        type="search"
        placeholder="Buscar villancico…"
        aria-label="Buscar villancico"
        class="btn"
        style="width:100%; text-align:left;"
      >
      <div id="countInfo" class="muted" style="margin-top:8px;"></div>
    </section>

    <!-- Lista -->
    <section class="card">
      <div id="villancicosList" style="display:grid; gap:10px;"></div>
    </section>

    <footer class="footer">
      <small>Familia Martínez Cuenca · 2025</small>
    </footer>

  </main>

  <!-- =========================
       SCRIPTS
       ========================= -->
  <script src="js/storage.js"></script>
  <script src="js/accessibility.js"></script>

  <script>
    async function loadVillancicos(){
      const res = await fetch("data/villancicos.json", { cache: "no-store" });
      const data = await res.json();
      return data;
    }

    function normalize(s){
      return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    }

    function getYouTubeId(url){
      if(!url) return "";
      const m = url.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
      return m ? m[1] : "";
    }

    function setPlayer(nombre, url){
      const id = getYouTubeId(url);
      document.getElementById("playerTitle").textContent = nombre;
      document.getElementById("ytPlayer").src =
        id ? `https://www.youtube.com/embed/${id}?autoplay=1` : "";
    }

    function makeRow(v){
      const btn = document.createElement("button");
      btn.className = "btn";
      btn.style.textAlign = "left";
      btn.textContent = v.Nombre;
      btn.onclick = () => setPlayer(v.Nombre, v.Url);
      return btn;
    }

    (async function(){
      const list = document.getElementById("villancicosList");
      const search = document.getElementById("searchInput");
      const count = document.getElementById("countInfo");

      const all = await loadVillancicos();

      function render(items){
        list.innerHTML = "";
        items.forEach(v => list.appendChild(makeRow(v)));
        count.textContent = `Mostrando ${items.length} de ${all.length}`;
      }

      search.oninput = () => {
        const q = normalize(search.value);
        render(all.filter(v => normalize(v.Nombre).includes(q)));
      };

      render(all);
    })();
  </script>

</body>
</html>
