<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Villancicos · Novena de Aguinaldos</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/img/favicon.png">

  <!-- Open Graph (WhatsApp / redes) -->
  <meta property="og:title" content="Novena de Aguinaldos">
  <meta property="og:description" content="Familia Martínez Cuenca">
  <meta property="og:image" content="https://orfell.github.io/novena-aguinaldos/assets/img/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://orfell.github.io/novena-aguinaldos/">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="dark">

  <!-- =========================
       CONTENIDO
       ========================= -->
  <main class="container" role="main">

    <!-- Título -->
    <section class="card">
      <h1 class="page-title">Villancicos</h1>
      <p class="muted">
        Toca un villancico para reproducirlo aquí mismo.
      </p>
    </section>

    <!-- Reproductor -->
    <section class="card">
      <h2 class="h2" id="playerTitle">Selecciona un villancico</h2>

      <!-- Contenedor de video -->
      <div
        id="videoContainer"
        style="
          position:relative;
          width:100%;
          padding-top:56.25%;
          border-radius:16px;
          overflow:hidden;
          border:1px solid rgba(255,255,255,0.18);
          box-shadow:0 10px 24px rgba(0,0,0,0.25);
        ">
        <iframe
          id="ytPlayer"
          title="Reproductor de YouTube"
          style="position:absolute; inset:0; width:100%; height:100%; border:0;"
          src=""
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>

      <p class="muted" id="playerHint" style="margin-top:10px;">
        Si no reproduce automáticamente, pulsa ▶ dentro del video.
      </p>
    </section>

    <!-- Buscar -->
    <section class="card">
      <h2 class="h2">Buscar</h2>
      <input
        id="searchInput"
        type="search"
        placeholder="Buscar villancico…"
        aria-label="Buscar villancico"
        class="btn"
        style="width:100%; text-align:left;"
      >
      <div id="countInfo" class="muted" style="margin-top:8px;"></div>
    </section>

    <!-- Lista de villancicos -->
    <section class="card">
      <div id="villancicosList" style="display:grid; gap:10px;"></div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <small>Familia Martínez Cuenca · 2025</small>
    </footer>

  </main>

  <!-- =========================
       SCRIPT (autónomo)
       ========================= -->
  <script>
    async function loadVillancicos(){
      const res = await fetch("data/villancicos.json", { cache: "no-store" });
      if(!res.ok) throw new Error("No se pudo cargar data/villancicos.json");
      const data = await res.json();
      if(!Array.isArray(data)) throw new Error("villancicos.json debe ser un arreglo");
      return data;
    }

    function normalize(s){
      return (s || "")
        .toString()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function getYouTubeId(url){
      if(!url) return "";
      const u = url.toString().trim();
      const m1 = u.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/);
      if(m1) return m1[1];
      const m2 = u.match(/[?&]v=([A-Za-z0-9_-]{6,})/);
      if(m2) return m2[1];
      const m3 = u.match(/youtube\.com\/embed\/([A-Za-z0-9_-]{6,})/);
      if(m3) return m3[1];
      return "";
    }

    function setPlayer(nombre, url){
      const id = getYouTubeId(url);
      const titleEl = document.getElementById("playerTitle");
      const hintEl  = document.getElementById("playerHint");
      const iframe  = document.getElementById("ytPlayer");

      titleEl.textContent = nombre || "Villancico";

      if(!id){
        iframe.src = "";
        hintEl.textContent = "Este villancico no tiene un enlace válido.";
        return;
      }

      iframe.src = `https://www.youtube.com/embed/${id}?rel=0&modestbranding=1&autoplay=1`;
      hintEl.textContent = "Si no reproduce automáticamente, pulsa ▶ dentro del video.";
    }

    function makeRow(v, idx){
      const nombre =
        (v.Nombre || v.nombre || v.Titulo || v.titulo || `Villancico ${idx+1}`)
          .toString()
          .trim();

      const url =
        (v.Url || v.url || v.Video || v.video || v.link || "")
          .toString()
          .trim();

      const ok = Boolean(getYouTubeId(url));

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn";
      btn.style.width = "100%";
      btn.style.textAlign = "left";
      btn.style.display = "flex";
      btn.style.justifyContent = "space-between";
      btn.style.alignItems = "center";
      btn.style.gap = "10px";
      btn.setAttribute("aria-label", `Reproducir: ${nombre}`);

      const left = document.createElement("div");
      left.style.display = "grid";
      left.style.gap = "2px";

      const t = document.createElement("div");
      t.style.fontWeight = "900";
      t.textContent = nombre;

      const s = document.createElement("div");
      s.className = "muted";
      s.textContent = ok ? "YouTube" : "Sin enlace válido";

      left.appendChild(t);
      left.appendChild(s);

      const right = document.createElement("div");
      right.textContent = ok ? "▶" : "—";
      right.setAttribute("aria-hidden", "true");

      btn.appendChild(left);
      btn.appendChild(right);

      if(!ok){
        btn.disabled = true;
        btn.style.opacity = "0.6";
        return btn;
      }

      btn.addEventListener("click", () => {
        setPlayer(nombre, url);
        document.getElementById("playerTitle")
          .scrollIntoView({ behavior: "smooth", block: "start" });
      });

      return btn;
    }

    (async function main(){
      const listEl = document.getElementById("villancicosList");
      const search = document.getElementById("searchInput");
      const countInfo = document.getElementById("countInfo");

      let all = [];
      try{
        all = await loadVillancicos();
      }catch(e){
        listEl.innerHTML = `<div class="muted">Error: ${String(e)}</div>`;
        return;
      }

      function render(items){
        listEl.innerHTML = "";
        items.forEach((v, i) => listEl.appendChild(makeRow(v, i)));
      }

      function applyFilter(){
        const q = normalize(search.value);
        const filtered = !q
          ? all
          : all.filter(v =>
              normalize(v.Nombre || v.nombre || v.Titulo || v.titulo).includes(q)
            );

        countInfo.textContent = `Mostrando ${filtered.length} de ${all.length}`;
        render(filtered);
      }

      search.addEventListener("input", applyFilter);
      applyFilter();

      const first = all.find(v => getYouTubeId(v.Url || v.url || v.Video || v.video || v.link));
      if(first){
        setPlayer(
          first.Nombre || first.Titulo || "Villancico",
          first.Url || first.url || first.Video || first.video || first.link
        );
      }
    })();
  </script>

</body>
</html>
