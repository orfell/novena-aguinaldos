<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Novena de Aguinaldos</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header class="topbar">
    <a class="brand" href="./index.html" aria-label="Volver al inicio">🎄 Novena de Aguinaldos</a>
    <div class="top-actions">
      <a class="btn small" href="./index.html">Inicio</a>
    </div>
  </header>

  <main class="container">

    <!-- Encabezado -->
    <section class="card">
      <h1 id="pageTitle" class="h1">Cargando…</h1>
    </section>

    <!-- Panel de accesibilidad (arriba del texto, como pediste) -->
    <section class="card accessibility-card" aria-label="Accesibilidad">
      <div class="accessibility-bar" role="toolbar" aria-label="Controles de lectura">
        <button id="btnTextSmaller" class="btn" type="button" aria-label="Disminuir tamaño de lectura">A-</button>
        <button id="btnTextBigger" class="btn" type="button" aria-label="Aumentar tamaño de lectura">A+</button>
        <button id="btnToggleTheme" class="btn" type="button" aria-label="Cambiar tema claro/oscuro">🌙</button>
      </div>
      <div class="accessibility-hint">Estos ajustes afectan solo el texto principal de lectura.</div>
    </section>

    <!-- Contenido principal (app.js escribe aquí) -->
    <section class="card reading-card">
      <h2 id="itemTitle" class="reading-title"></h2>
      <div id="itemMeta" class="muted"></div>
      <div id="itemText" class="reading-text" tabindex="0"></div>
    </section>

    <!-- Navegación (app.js controla visibilidad y modo) -->
    <section id="navCard" class="card">
      <h2 id="navTitle" class="h2">Navegación</h2>

      <div id="dayButtons" class="grid-3" style="display:none;"></div>
      <div id="prayerButtons" class="grid-2" style="display:none;"></div>

      <div id="navHint" class="muted"></div>
    </section>

    <!-- Audio (audio.js usa estos IDs) -->
    <section class="card">
      <h2 class="h2">Audio</h2>
      <audio id="audioPlayer" controls preload="none" class="audio"></audio>
      <div class="muted" id="audioHint">Pulsa ▶ para escuchar el audio.</div>
    </section>

  </main>

  <footer class="footer">
    <div class="muted">App accesible • Modo lectura • Audios locales</div>
  </footer>

  <!-- Scripts en el orden correcto -->
  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <!-- ui.js puede estar vacío; si quieres, puedes quitar esta línea -->
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/accessibility.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
