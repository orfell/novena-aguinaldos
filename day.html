<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Novena de Aguinaldos</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="dark">

  <header class="topbar">
    <a class="brand" href="./index.html" aria-label="Volver al inicio">🎄 Novena de Aguinaldos</a>
    <div class="top-actions">
      <a class="btn small" href="./index.html">Inicio</a>
    </div>
  </header>

  <main class="container">

    <!-- ✅ ESTE ID ES OBLIGATORIO PARA QUE app.js INICIALICE -->
    <section class="card">
      <h2 id="pageTitle" class="h2">Cargando…</h2>
    </section>

    <!-- Accesibilidad (A- / A+) -->
    <section class="card accessibility-card" aria-label="Accesibilidad">
      <div class="accessibility-bar" role="toolbar" aria-label="Controles de lectura">
        <!-- ✅ IDs que usa tu accessibility.js -->
        <button id="btnTextSmaller" class="btn" type="button" aria-label="Disminuir tamaño de lectura">A-</button>
        <button id="btnTextBigger" class="btn" type="button" aria-label="Aumentar tamaño de lectura">A+</button>
      </div>
    </section>

    <!-- Contenido principal -->
    <section id="content" class="card reading-card">
      <h3 id="itemTitle" class="reading-title"></h3>
      <div id="itemMeta" class="muted"></div>

      <!-- ✅ Imagen del día (dinámica) -->
		<div id="readingMedia" class="reading-media">
        <img id="itemImage" class="reading-image" alt="" loading="lazy" decoding="async">
      </div>

      <div id="itemText" class="reading-text" tabindex="0"></div>
    </section>

    <!-- Navegación -->
    <section id="navCard" class="card">
      <h2 id="navTitle" class="h2">Navegación</h2>

      <div id="dayButtons" class="grid-3" style="display:none;"></div>
      <div id="prayerButtons" class="grid-2" style="display:none;"></div>

      <div id="navHint" class="muted"></div>
    </section>

    <!-- Audio (✅ sin tarjeta anidada) -->
    <section class="card">
      <h2 class="h2">Audio</h2>
      <audio id="audioPlayer" class="audio" controls preload="none"></audio>
    </section>

  </main>

  <footer class="footer">
    <div class="muted">Julio Ricardo Martínez Montezuma</div>
	<div class="muted">2025</div>
  </footer>

  <!-- Scripts (en el orden que venías usando) -->
  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/accessibility.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
