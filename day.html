<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Día · Novena</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header>
    <h1 id="pageTitle">Día</h1>
    <a href="index.html">← Inicio</a>
  </header>

  <main>
    <article class="card">
      <h2 id="itemTitle">Cargando…</h2>
      <p id="itemMeta" class="muted"></p>
      <p id="itemText"></p>
    </article>

    <!-- NAVEGACIÓN POR BOTONES 1–9 (solo para tipo=dias) -->
    <article class="card" id="navCard">
      <h3 style="margin-top:0">Ir al día</h3>

      <div id="dayButtons" class="day-buttons">
        <!-- Se llena desde app.js -->
      </div>

      <p id="navHint" class="muted" style="margin:12px 0 0;">
        Día actual: —
      </p>
    </article>

    <!-- Audio (solo reproductor nativo) -->
    <article class="card">
      <h3 style="margin-top:0">Audio</h3>

      <audio id="audioPlayer" controls preload="metadata">
        Tu navegador no soporta audio.
      </audio>

      <p id="audioHint" class="muted">
        Audio no disponible para este contenido.
      </p>
    </article>

    <!-- Accesibilidad (A-/A+, modo noche) -->
    <article class="card" id="accessibilityCard">
      <p style="margin:0"><b>Accesibilidad</b></p>

      <div class="grid" style="grid-template-columns: 1fr 1fr 1fr; margin-top:10px;">
        <button id="fontMinus">A−</button>
        <button id="fontPlus">A+</button>
        <button id="toggleTheme">🌙</button>
      </div>

      <p class="muted" style="margin-top:10px">
        Ajustes pensados para lectura cómoda.
      </p>
    </article>
  </main>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/accessibility.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
