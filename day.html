<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f1220" />
  <title>Novena · Lectura</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">


	<!-- Para WhatsApp / redes -->
	<meta property="og:title" content="Novena de Aguinaldos">
	<meta property="og:description" content="Familia Martínez Cuenca">
	<meta property="og:image" content="https://orfell.github.io/novena-aguinaldos/assets/img/icon-512.png">
	<meta property="og:type" content="website">
  
</head>

<body class="dark">
  <!-- Topbar (2 filas) -->
  <header class="topbar topbar--double" role="banner">
    <!-- Fila 1: título -->
    <div class="topbar-row topbar-row--brand">
      <span class="brand-title" aria-label="Novena de Aguinaldos">🎄 Novena de Aguinaldos</span>
    </div>

    <!-- Fila 2: acciones SIEMPRE en una sola línea -->
    <nav class="topbar-row topbar-row--actions" aria-label="Acciones">
      <button id="btnTextSmaller" class="btn small" type="button" aria-label="Disminuir tamaño del texto">A-</button>
      <button id="btnTextBigger" class="btn small" type="button" aria-label="Aumentar tamaño del texto">A+</button>
      <a class="btn small btn-home" href="./index.html" aria-label="Inicio">Inicio</a>
    </nav>
  </header>

  <main class="container" role="main">
    <!-- Título de página -->
    <section class="card">
      <h2 id="pageTitle" class="page-title">Cargando...</h2>
    </section>

    <!-- Contenido principal (UNA sola card) -->
    <section id="content" class="card reading-card">
      <h3 id="itemTitle" class="reading-title"></h3>
      <div id="itemMeta" class="muted"></div>

      <!-- Imagen dinámica -->
      <div id="readingMedia" class="reading-media">
        <img id="itemImage" class="reading-image" alt="" loading="lazy" decoding="async">
      </div>

      <!-- Texto -->
      <div id="itemText" class="reading-text" tabindex="0"></div>
    </section>

    <!-- Navegación -->
    <section id="navCard" class="card">
      <div id="navTitle" class="h2">Ir al día</div>

      <div id="dayButtons" class="grid-3"></div>
      <div id="prayerButtons" class="grid-2" style="display:none;"></div>

      <div id="navHint" class="muted"></div>
    </section>

    <!-- Audio -->
    <section class="card">
      <div class="h2">Audio</div>
      <audio id="audioPlayer" class="audio" controls preload="metadata"></audio>
    </section>

    <footer class="footer">
      <small>Desarrollado por Julio Ricardo Martínez Montezuma</small>
    </footer>
  </main>

  <!-- JS (orden importa) -->
  <script src="js/storage.js"></script>
  <script src="js/accessibility.js"></script>
  <script src="js/app.js"></script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
