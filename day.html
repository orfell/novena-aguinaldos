<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f1220" />
  <title>Novena · Lectura</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">

  <!-- iOS/PWA friendly -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body class="dark">
  <!-- Topbar doble (móvil): fila 1 título + inicio, fila 2 A-/A+ centrados -->
	<header class="topbar topbar--double">
	  <!-- Fila 1: título -->
	  <div class="topbar-row topbar-row--brand">
		<span class="brand-title">🎄 Novena de Aguinaldos</span>
	  </div>

	  <!-- Fila 2: acciones (UNA sola línea) -->
	  <div class="topbar-row topbar-row--actions" aria-label="Herramientas de lectura">
		<button id="btnTextSmaller" class="btn small" type="button" aria-label="Disminuir tamaño del texto">A-</button>
		<button id="btnTextBigger" class="btn small" type="button" aria-label="Aumentar tamaño del texto">A+</button>
		<a class="btn small btn-home" href="./index.html" aria-label="Inicio">Inicio</a>
	  </div>
	</header>

  <main class="container">
    <!-- Título de página -->
    <section class="card">
      <h2 id="pageTitle" class="page-title">Cargando...</h2>
    </section>

    <!-- Contenido principal (UNA sola card) -->
    <section id="content" class="card reading-card">
      <h3 id="itemTitle" class="reading-title"></h3>
      <div id="itemMeta" class="muted"></div>

      <!-- Imagen dinámica (Días y Oraciones) -->
      <div id="readingMedia" class="reading-media">
        <img id="itemImage" class="reading-image" alt="" loading="lazy" decoding="async">
      </div>

      <!-- Texto (escala con --reading-scale) -->
      <div id="itemText" class="reading-text" tabindex="0"></div>
    </section>

    <!-- Navegación -->
    <section id="navCard" class="card">
      <div id="navTitle" class="h2">Ir al día</div>

      <!-- Días 1–9 -->
      <div id="dayButtons" class="grid-3"></div>

      <!-- Oraciones 1–5 -->
      <div id="prayerButtons" class="grid-2" style="display:none;"></div>

      <div id="navHint" class="muted"></div>
    </section>

    <!-- Audio -->
    <section class="card">
      <div class="h2">Audio</div>
      <audio id="audioPlayer" class="audio" controls preload="metadata"></audio>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <small>Desarrollado por Julio Ricardo Martínez Montezuma</small>
    </footer>
  </main>

  <!-- JS (orden importa) -->
  <script src="js/storage.js"></script>
  <script src="js/accessibility.js"></script>
  <script src="js/app.js"></script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
